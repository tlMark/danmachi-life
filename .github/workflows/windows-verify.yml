# Windows 호환성 검증(수동 실행 전용, 사용자 결정 2026-11-28 "Node 판 검증 후에 윈도우스 검증도 합시다"). 게임 코드를 바꾸지 않는다.
# 대상: G1 기준선(logs/baseline_main_605fdf4)과의 게임 결과 바이트 비교, 단위 시험, Chromium file://·inline, 측정 사본 시험.
# crlf=false: 줄바꿈 변환 없이 받은 경우(ZIP 다운로드와 같은 LF). crlf=true: Windows Git 기본 설정(core.autocrlf=true)으로 받은 경우.
name: windows-verify
# 실행 조건: 작업 브랜치에서 이 파일이나 .github/windows-verify.trigger 가 바뀐 push(수동 실행은 기본 브랜치에 파일이 있어야 해서 push 조건을 함께 둠).
on:
  workflow_dispatch:
  push:
    branches: ['claude/affectionate-allen-za239g']
    paths: ['.github/workflows/windows-verify.yml', '.github/windows-verify.trigger']
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        crlf: ['false', 'true']
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: git line endings
        run: git config --global core.autocrlf ${{ matrix.crlf }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fsr_g1_test·rng_timer 등이 git 이력의 F1 커밋을 꺼낸다(얕은 clone 이면 '미실행' 처리로 실패)
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: install playwright (tests only, no save)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install chromium
      - name: run checks
        run: |
          set +e   # 시험 하나가 실패해도 나머지를 끝까지 실행한다(판정은 summary 에서)
          mkdir -p wout
          S=wout/summary.txt; : > $S
          echo "node $(node --version) · $(uname -a) · crlf=${{ matrix.crlf }} · $(date -u +%FT%TZ)" | tee -a $S
          BL=logs/baseline_main_605fdf4
          step() { n=$1; shift; "$@" > "wout/$n.log" 2>&1; rc=$?; echo "exit=$rc" >> "wout/$n.log"; echo "$n exit=$rc" | tee -a $S; if [ $rc -ne 0 ]; then echo "----- $n 실패 로그(FAIL 줄·끝 25줄) -----"; grep -a -E '^FAIL|RESULT|Error|error' "wout/$n.log" | head -40; tail -25 "wout/$n.log"; echo "----- 끝 -----"; fi; }
          for s in 20261104 777; do
            SIM_SEED=$s node test_runner.js > wout/tr_$s.log 2>&1; printf 'exit=%s\n' $? >> wout/tr_$s.log
            if cmp -s wout/tr_$s.log $BL/tr_$s.log; then echo "A tr_$s: G1 기준선과 바이트 동일" | tee -a $S; else echo "A tr_$s: 다름 ($(grep '^lifeDigest' wout/tr_$s.log | tr -d '\r'))" | tee -a $S; fi
          done
          step A_digest10 node logs/v178_f1/tools/digest10.js "$(pwd)" wout/digest10.json
          step A_digest10_strict node tests/digest10_strict.js wout/digest10.json $BL/digest10.json "G1 605fdf4 기준"
          for t in p4_test fsr_g1_test engine_p2_test region_p3_test eventcond_test devabil_test n2_rollback_test followup_pf_test followup_halt_test f1_joinhard_test f1_transition_test god_gone_2ba_test residence_ri_test sync_2i_test jobsince_test recruit_2bb_test feat_p5_test rng_sites_test; do step B_$t node tests/$t.js; done
          step C_browser_file node tests/browser_test.js 24
          BROWSER_LOAD=inline step C_browser_inline node tests/browser_test.js 24
          step D_ast_check node measure/ast_check.js
          step D_ast_neg node measure/tests/ast_neg_test.js
          step D_meas_fault node measure/tests/meas_fault_test.js "$RUNNER_TEMP/meas_fault"
          step D_meas_noninterf node measure/tests/meas_noninterf.js "$RUNNER_TEMP/noninterf" 3000 20261104,777
          echo "end $(date -u +%FT%TZ)" | tee -a $S
          echo "===== summary ====="; cat $S
          if grep -q 'exit=[1-9]' $S; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verify-crlf-${{ matrix.crlf }}
          path: wout/
